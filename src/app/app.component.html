<div class="game-wrapper">
  <div class="toolbar">
    <label for="difficulty-select"></label>

    <select
      #diffSelect
      id="difficulty-select"
      [(ngModel)]="difficulty"
      (change)="newGame(difficulty)"
    >
      @for (level of DIFFICULTY_LEVELS; track level) {
        <option [ngValue]="level">{{ level }}</option>
      }
    </select>

    <div class="divider"></div>

    <button class="restart-btn" (click)="newGame()">New</button>

    <button
      class="restart-btn"
      (click)="restartGame()"
      [disabled]="moves === 100"
    > Rest {{ restCount }}</button>

    <button
      class="restart-btn"
      (click)="undo()"
      [disabled]="moveHistory.length === 0"
    >
      Undo
    </button>

    <button
      class="restart-btn"
      (click)="showNext()"
      [disabled]="won || restCount < 25"
    >
      H({{ solutionPath.length }})
    </button>
  </div>

  <div class="header" style="display: block">
    Moves: <strong>{{ moves }}</strong>
  </div>

  <div class="tubes-grid" [style.grid-template-columns]="gridColumns">
    @for (tube of tubes; track $index; let i = $index) {
      <div
        class="tube-wrapper"
        [class.lifted]="selectedIndex === i"
        [class.solved]="isSolved(tube)"
        [class.valid-target]="isValidTarget(i)"
        (click)="onTubeClick(i)"
      >
        <div class="tube">
          @for (slot of getSlots(tube); track $index) {
            <div
              class="color-slot"
              [class.empty]="!slot"
              [style.background]="slot ?? ''"
            ></div>
          }
        </div>

        <div class="tube-base"></div>

        @if (isSolved(tube)) {
          <div class="tube-cover"></div>
        }
      </div>
    }
  </div>

  <div class="color-palette" style="display: none">
    @for (color of COLORS; track color) {
      <div class="color-cell" [style.background]="color"></div>
    }
  </div>

  @if (won) {
    <div class="win-overlay" (click)="closeWinPopup()">
      <div class="win-card" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="closeWinPopup()">✕</button>

        <div class="win-emoji">🎉</div>

        <h2>Puzzle Solved!</h2>

        <p>
          Completed in <strong>{{ moves }}</strong> moves
        </p>

        <button (click)="newGame()">Play Again</button>
      </div>
    </div>
  }
</div>
